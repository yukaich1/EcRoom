[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolving-creative-room"
version = "0.1.0"
description = "Human-in-the-loop multi-agent creative workspace with traceable memory and harness evolution."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Evolving Creative Room" }]
dependencies = ["chromadb>=1.5.9", "numpy>=1.22.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ecr-demo = "evolving_creative_room.demo:main"
ecr-web = "evolving_creative_room.web:main"

[tool.setuptools.packages.find]
include = ["evolving_creative_room*"]

[tool.setuptools.package-data]
evolving_creative_room = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/assets/*.png",
    "static/assets/inspiration/*.jpg",
]
